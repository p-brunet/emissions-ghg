# pyproject.toml
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]  # pycodestyle errors, pyflakes, warnings, isort
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[project]
name = "emissions-ghg"
version = "0.0.0"

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "scripts*"]