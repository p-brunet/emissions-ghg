dbt_emissions_ghg:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: ../emissions_ghg.duckdb
      schema: main
      threads: 4
      extensions:
        - iceberg
        - spatial
        - httpfs
      settings:
        s3_endpoint: "{{ env_var('MINIO_ENDPOINT', 'localhost:9000') }}"
        s3_access_key_id: minioadmin
        s3_secret_access_key: minioadmin
        s3_url_style: path
        s3_use_ssl: false
        unsafe_enable_version_guessing: true
